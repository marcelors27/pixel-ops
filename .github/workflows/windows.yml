name: Windows

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: config-studio/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest

      - name: Build Config Studio
        working-directory: config-studio
        run: npm ci && npm run build

      - name: Render offline preview
        run: python pixel_ops\main.py --plugin pokemon --output preview --offline
